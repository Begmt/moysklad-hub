services:
  postgres:
    image: postgres:16-alpine
    container_name: moysklad-hub-postgres
    environment:
      POSTGRES_DB: moysklad_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - moysklad_hub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moysklad_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: moysklad-hub-redis
    ports:
      - "6379:6379"
    volumes:
      - moysklad_hub_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  moysklad_hub_pg:
  moysklad_hub_redis:
